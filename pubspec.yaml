name: habitur
description: A habit tracking app that helps you build better habits.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
    sdk: ">=3.1.3 <4.0.0"

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.2
    firebase_core: ^3.8.1
    firebase_auth: ^5.3.4
    cloud_firestore: ^5.5.1
    provider: ^6.1.1
    google_fonts: ^6.2.1
    percent_indicator: ^4.2.3
    hive: ^2.2.3
    hive_flutter: ^1.1.0
    flutter_slidable: ^3.1.0
    fl_chart: ^0.65.0
    intl: ^0.19.0
    flutter_heatmap_calendar: ^1.0.5
    confetti: ^0.7.0
    awesome_notifications: ^0.8.2
    animated_splash_screen: ^1.3.0
    flutter_launcher_icons: ^0.13.1
    timeago: ^3.7.0
    stacked: ^3.4.2
    stacked_services: ^1.4.0
    path_provider: ^2.1.2
    connectivity_plus: ^5.0.2
    mockito: ^5.4.2
    dots_indicator: ^3.0.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^2.0.0
    build_runner: ^2.4.8
    stacked_generator: ^1.5.1
    hive_generator: ^2.0.1

flutter_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/app_icons/app_icon_dark.png"
    remove_alpha_ios: true

flutter:
    uses-material-design: true

    assets:
        - assets/
        - assets/images/

